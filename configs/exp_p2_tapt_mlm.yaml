# Eksperimen P2 — Task-Adaptive Pretraining (TAPT via Masked Language Modeling)
# Target: Domain adaptation pada korpus tweet banjir (~8.648 tweet) sebelum supervised LoRA fine-tuning.

exp_id: exp_p2_tapt_mlm
family: hf_tapt_lora
title: "Thesis LoRA - P2 Task Adaptive Pretraining"
description: "P2 - TAPT via MLM 3 Epoch pada Korpus Banjir + Downstream LoRA Fine-Tuning"

target_gate: 0.80

params:
  # Tahap 1: Masked Language Modeling (TAPT)
  mlm_epochs: 3
  mlm_learning_rate: 0.00005
  mlm_probability: 0.15
  mlm_batch_size: 16
  mlm_weight_decay: 0.01

  # Tahap 2: Downstream LoRA Classification
  ft_learning_rate: 0.0002
  ft_epochs: 8
  ft_batch_size: 16
  ft_warmup_ratio: 0.1
  ft_weight_decay: 0.01
  dropout: 0.3
  lora_r: 16
  lora_alpha: 32
  max_length: 128

dataset_sources:
  - emanuelembuaijdak/thesis-indobert-processed-data
